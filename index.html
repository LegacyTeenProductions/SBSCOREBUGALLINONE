<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Name Tester</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 30px;
            text-align: center;
        }

        /* The Minimal Scorebug Graphic Box */
        .scorebug-display {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto 30px auto;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .team-line {
            margin: 10px 0;
            padding: 5px;
        }
        
        #bugAway { color: #ff4d4d; }
        #bugHome { color: #3399ff; }

        /* The Input Controls Container */
        .control-panel {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .control-panel h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        input:focus {
            outline: 2px solid #ffcc00;
            background-color: #444;
        }
    </style>
</head>
<body>

    <!-- 1. THE SCOREBUG VISUAL BOX -->
    <div class="scorebug-display">
        <div class="team-line">AWAY: <span id="bugAway">TEAM A</span></div>
        <div class="team-line">HOME: <span id="bugHome">TEAM B</span></div>
    </div>

    <!-- 2. THE CONTROL INPUTS -->
    <div class="control-panel">
        <h3>Change Team Names Below:</h3>
        
        <input type="text" id="inputAway" value="TEAM A" oninput="updateAwayName()" placeholder="Type Away Name...">
        <input type="text" id="inputHome" value="TEAM B" oninput="updateHomeName()" placeholder="Type Home Name...">
    </div>

    <!-- 3. THE SCRIPT ENGINE -->
    <script>
        // This function runs every single time you type a letter in the Away input box
        function updateAwayName() {
            const currentInputValue = document.getElementById('inputAway').value;
            document.getElementById('bugAway').innerText = currentInputValue || 'AWAY';
        }

        // This function runs every single time you type a letter in the Home input box
        function updateHomeName() {
            const currentInputValue = document.getElementById('inputHome').value;
            document.getElementById('bugHome').innerText = currentInputValue || 'HOME';
        }
    </script>

</body>
</html>
