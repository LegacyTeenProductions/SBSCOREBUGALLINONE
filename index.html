<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team, Count, Inning & Run Tracker</title>
    <style>
        /* --- CORE STANDALONE IPAD OPTIMIZATIONS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none; /* Disables selection overlays on fast touch */
            user-select: none;
            touch-action: manipulation; /* Removes 300ms double-tap zoom delay */
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        /* --- 1. THE SCOREBUG VISUAL BOX --- */
        .scorebug-display {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Your exact working team lines style */
        .team-line {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }
        #bugAway { color: #ff4d4d; }
        #bugHome { color: #3399ff; }

        /* Your exact working 2-column data row layout */
        .data-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .data-box {
            background-color: #181818;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 10px;
        }

        .data-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffcc00;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }


        /* --- 2. THE CONTROL PANEL CONTAINER --- */
        .control-panel {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }

        .panel-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .panel-section h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        /* Name Inputs */
        input {
            width: 100%;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            -webkit-user-select: text; /* Allows typing inside text field */
            user-select: text;
        }

        /* Large Touch Buttons Grid */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            background: #3e3e3e;
            color: white;
            border: none;
            padding: 18px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 0 #1a1a1a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a1a1a;
        }

        button.plus-run { background: #2e7d32; box-shadow: 0 4px 0 #1b5e20; }
        button.plus-ball { background: #5e35b1; box-shadow: 0 4px 0 #4527a0; }
        button.plus-strike { background: #1565c0; box-shadow: 0 4px 0 #0d47a1; }
        button.plus-out { background: #ef6c00; box-shadow: 0 4px 0 #b30000; }
        button.plus-inning { background: #00796b; box-shadow: 0 4px 0 #004d40; }
        button.sub-btn { background: #c62828; box-shadow: 0 4px 0 #8e1c1c; padding: 12px 10px; font-size: 14px;}
        button.clear-btn { background: #4f5b66; box-shadow: 0 4px 0 #343d46; padding: 12px 10px; font-size: 14px;}
    </style>
</head>
<body>

    <!-- 1. THE SCOREBUG VISUAL BOX -->
    <div class="scorebug-display">
        <!-- Safely appending plain text placeholders for Runs right into your un-nested text lines -->
        <div class="team-line">AWAY: <span id="bugAway">TEAM A</span> — RUNS: <span id="dispAwayRuns" style="color: #ffcc00;">0</span></div>
        <div class="team-line">HOME: <span id="bugHome">TEAM B</span> — RUNS: <span id="dispHomeRuns" style="color: #ffcc00;">0</span></div>
        <div class="team-line" style="font-size: 20px; color: #aaa; border-top: 1px solid #333; padding-top: 10px; margin-top: 10px;">
            INNING: <span id="dispInning" style="color: #ffcc00;">▲ 1</span>
        </div>
        
        <div class="data-row">
            <div class="data-box">
                <div class="data-label">Count (B - S)</div>
                <div class="data-value" id="dispCount">0 - 0</div>
            </div>
            <div class="data-box">
                <div class="data-label">Outs</div>
                <div class="data-value" id="dispOuts">0</div>
            </div>
        </div>
    </div>

    <!-- 2. THE CONTROL PANEL -->
    <div class="control-panel">
        
        <!-- Section: Team Names -->
        <div class="panel-section">
            <h3>Team Names</h3>
            <input type="text" id="inputAway" value="TEAM A" oninput="updateNames()" placeholder="Away Name...">
            <input type="text" id="inputHome" value="TEAM B" oninput="updateNames()" placeholder="Home Name...">
        </div>

        <!-- Section: Away Runs -->
        <div class="panel-section">
            <h3 style="color: #ff4d4d;">Away Team Runs</h3>
            <div class="btn-row">
                <button class="plus-run" onclick="adjustCount('awayRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustCount('awayRuns', -1)">-1 Run</button>
            </div>
        </div>

        <!-- Section: Home Runs -->
        <div class="panel-section">
            <h3 style="color: #3399ff;">Home Team Runs</h3>
            <div class="btn-row">
                <button class="plus-run" onclick="adjustCount('homeRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustCount('homeRuns', -1)">-1 Run</button>
            </div>
        </div>

        <!-- Section: Innings -->
        <div class="panel-section">
            <h3>Innings</h3>
            <div class="btn-row">
                <button class="plus-inning" onclick="adjustCount('inning', 1)">+1 Inning</button>
                <button class="sub-btn" onclick="adjustCount('inning', -1)">-1 Inning</button>
                <button class="clear-btn" onclick="toggleInningHalf()">Top / Bot</button>
            </div>
        </div>

        <!-- Section: At Bat Trackers -->
        <div class="panel-section">
            <h3>At Bat Trackers</h3>
            <div class="btn-row">
                <button class="plus-ball" onclick="adjustCount('balls', 1)">+1 Ball</button>
                <button class="plus-strike" onclick="adjustCount('strikes', 1)">+1 Strike</button>
            </div>
            <div class="btn-row">
                <button class="sub-btn" onclick="adjustCount('balls', -1)">-1 Ball</button>
                <button class="sub-btn" onclick="adjustCount('strikes', -1)">-1 Strike</button>
                <button class="clear-btn" onclick="clearCount()">Clear Count</button>
            </div>
        </div>

        <!-- Section: Inning Outs -->
        <div class="panel-section">
            <h3>Inning Outs</h3>
            <div class="btn-row">
                <button class="plus-out" onclick="adjustCount('outs', 1)">+1 Out</button>
                <button class="sub-btn" onclick="adjustCount('outs', -1)">-1 Out</button>
            </div>
        </div>

    </div>

    <!-- 3. THE SCRIPT ENGINE -->
    <script>
        // Data State Object extended cleanly with run trackers
        let game = {
            balls: 0,
            strikes: 0,
            outs: 0,
            inning: 1,
            isInningTop: true,
            awayRuns: 0,
            homeRuns: 0
        };

        // Your exact working team name entry code
        function updateNames() {
            const awayVal = document.getElementById('inputAway').value;
            const homeVal = document.getElementById('inputHome').value;
            document.getElementById('bugAway').innerText = awayVal || 'AWAY';
            document.getElementById('bugHome').innerText = homeVal || 'HOME';
        }

        // Handles additions and subtractions across variables safely with no typos
        function adjustCount(field, value) {
            game[field] = Math.max(0, game[field] + value);

            // Softball Rule Automations:
            if (field === 'outs' && game.outs >= 3) {
                game.outs = 0;
                game.balls = 0;
                game.strikes = 0;
            }
            if (field === 'balls' && game.balls >= 4) {
                game.balls = 0;
            }
            if (field === 'strikes' && game.strikes >= 3) {
                game.strikes = 0;
            }

            renderDisplay();
        }

        // Toggles between Top (▲) and Bottom (▼) half-innings
        function toggleInningHalf() {
            game.isInningTop = !game.isInningTop;
            renderDisplay();
        }
