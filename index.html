<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-In-One Softball Scorebug</title>
    <style>
        /* --- GLOBAL RESETS & FONTS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        body {
            background-color: #1a1a1a; /* Dark background for standalone viewing */
            padding: 20px;
            color: #fff;
        }

        /* --- SCOREBUG LAYOUT (THE OVERLAY) --- */
        .broadcast-container {
            background: transparent;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 40px;
            border-bottom: 2px dashed #444;
        }

        .scorebug {
            display: flex;
            align-items: center;
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #333;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
            overflow: hidden;
            height: 55px;
            letter-spacing: 1px;
        }

        /* Teams Section */
        .teams-block {
            display: flex;
            flex-direction: column;
            width: 220px;
            height: 100%;
        }

        .team-row {
            display: flex;
            align-items: center;
            height: 25px;
            padding: 0 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .away-team { background-color: #b30000; } /* Red Away Team */
        .home-team { background-color: #004488; } /* Blue Home Team */

        .team-name {
            flex-grow: 1;
            font-weight: 900;
        }

        .team-score {
            font-size: 16px;
            font-weight: 900;
            background: rgba(0,0,0,0.3);
            padding: 0 8px;
            border-radius: 3px;
            min-width: 30px;
            text-align: center;
        }

        /* RHE Info Matrix */
        .rhe-matrix {
            display: flex;
            flex-direction: column;
            background: #222;
            border-left: 1px solid #444;
            border-right: 1px solid #444;
            font-size: 10px;
            height: 100%;
            justify-content: center;
        }
        .rhe-row {
            display: flex;
            padding: 1px 6px;
            color: #aaa;
        }
        .rhe-cell {
            width: 24px;
            text-align: center;
        }
        .rhe-row.values {
            color: #fff;
            font-size: 12px;
        }

        /* Inning & Outs Section */
        .game-state-block {
            display: flex;
            align-items: center;
            background: #2b2b2b;
            padding: 0 15px;
            height: 100%;
            border-right: 1px solid #444;
        }

        .inning-indicator {
            display: flex;
            align-items: center;
            font-size: 16px;
            margin-right: 15px;
        }

        .arrow {
            font-size: 12px;
            margin-right: 4px;
            color: #ffcc00;
        }

        .outs-container {
            display: flex;
            gap: 5px;
        }

        .out-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #444;
            border: 1px solid #666;
        }

        .out-dot.active {
            background-color: #ff3333; /* Red dot for active out */
            box-shadow: 0 0 8px #ff3333;
        }

        /* Count (B-S) Section */
        .count-block {
            background: #1e1e1e;
            padding: 0 15px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 13px;
            color: #ffcc00;
            min-width: 60px;
            border-right: 1px solid #444;
        }

        /* Diamond Base Graphic */
        .diamond-block {
            background: #252525;
            width: 65px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .diamond {
            width: 32px;
            height: 32px;
            position: relative;
            transform: rotate(45deg);
        }

        .base {
            position: absolute;
            width: 9px;
            height: 9px;
            background-color: #555;
            border: 1px solid #777;
        }

        .base.active {
            background-color: #ffcc00; /* Yellow for occupied bases */
            box-shadow: 0 0 6px #ffcc00;
        }

        .base.first { top: 0; right: 0; }
        .base.second { top: 0; left: 0; }
        .base.third { bottom: 0; left: 0; }


        /* --- INTERACTIVE CONTROL PANEL --- */
        .control-panel {
            background-color: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
        }

        .control-panel h2 {
            margin-bottom: 15px;
            font-family: sans-serif;
            font-size: 18px;
            color: #aaa;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .ctrl-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .ctrl-group {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 6px;
            flex: 1;
            min-width: 180px;
        }

        .ctrl-group h3 {
            font-family: sans-serif;
            font-size: 13px;
            margin-bottom: 8px;
            color: #ddd;
        }

        .btn-grid {
            display: flex;
            gap: 5px;
        }

        button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: sans-serif;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background: #555; }
        button:active { background: #666; }
        
        button.plus { background: #28a745; }
        button.plus:hover { background: #218838; }
        button.minus { background: #dc3545; }
        button.minus:hover { background: #c82333; }
        button.reset-btn { background: #6c757d; width: 100%; margin-top: 10px;}

        .team-settings {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .team-settings input {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 6px;
            border-radius: 4px;
            width: 120px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <!-- 1. THE SCOREBUG OVERLAY CONTAINER -->
    <div class="broadcast-container">
        <div class="scorebug">
            
            <!-- Teams & Scores -->
            <div class="teams-block">
                <div class="team-row away-team">
                    <span class="team-name" id="bugAwayName">AWAY</span>
                    <span class="team-score" id="bugAwayScore">0</span>
                </div>
                <div class="team-row home-team">
                    <span class="team-name" id="bugHomeName">HOME</span>
                    <span class="team-score" id="bugHomeScore">0</span>
                </div>
            </div>

            <!-- RHE Matrix -->
            <div class="rhe-matrix">
                <div class="rhe-row">
                    <div class="rhe-cell">H</div><div class="rhe-cell">E</div>
                </div>
                <div class="rhe-row values">
                    <div class="rhe-cell" id="bugAwayHits">0</div><div class="rhe-cell" id="bugAwayErrors">0</div>
                </div>
                <div class="rhe-row values">
                    <div class="rhe-cell" id="bugHomeHits">0</div><div class="rhe-cell" id="bugHomeErrors">0</div>
                </div>
            </div>

            <!-- Inning & Outs -->
            <div class="game-state-block">
                <div class="inning-indicator">
                    <span class="arrow" id="bugInningArrow">▲</span>
                    <span id="bugInningNum">1</span>
                </div>
                <div class="outs-container">
                    <div class="out-dot" id="out1"></div>
                    <div class="out-dot" id="out2"></div>
                </div>
            </div>

            <!-- Count (Balls / Strikes) -->
            <div class="count-block">
                <div>B: <span id="bugBalls">0</span></div>
                <div>S: <span id="bugStrikes">0</span></div>
            </div>

            <!-- Diamond Base Tracking -->
            <div class="diamond-block">
                <div class="diamond">
                    <div class="base second" id="base2"></div>
                    <div class="base first" id="base1"></div>
                    <div class="base third" id="base3"></div>
                </div>
            </div>

        </div>
    </div>


    <!-- 2. THE OPERATOR CONTROL PANEL -->
    <div class="control-panel">
        <h2>Scorebug Control Panel</h2>
        
        <!-- Quick Name Config -->
        <div class="team-settings">
            <input type="text" id="inputAway" value="AWAY" oninput="updateNames()" placeholder="Away Team">
            <input type="text" id="inputHome" value="HOME" oninput="updateNames()" placeholder="Home Team">
        </div>

        <div class="ctrl-row">
            <!-- Score Controls -->
            <div class="ctrl-group">
