<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complete Softball Scorekeeper</title>
    <style>
        /* --- CORE STANDALONE IPAD OPTIMIZATIONS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none; 
            user-select: none;
            touch-action: manipulation; 
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        /* --- 1. THE SCOREBUG VISUAL BOX --- */
        .scorebug-display {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Teams Layout Grid with Run Box Columns */
        .team-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .team-label-text {
            font-size: 26px;
            font-weight: bold;
            text-align: left;
        }
        .away-color { color: #ff4d4d; }
        .home-color { color: #3399ff; }

        .run-digit {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 36px;
            background-color: #000;
            color: #ffcc00;
            padding: 2px 14px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
            min-width: 65px;
            text-align: center;
        }

        /* The Data Display Row (Count, Outs, Inning) */
        .data-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }

        .data-box {
            background-color: #181818;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 8px 4px;
        }

        .data-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        .yellow-text { color: #ffcc00; }


        /* --- 2. THE CONTROL PANEL CONTAINER --- */
        .control-panel {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .panel-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .panel-section h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        /* Name Inputs */
        input {
            width: 100%;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            -webkit-user-select: text; 
            user-select: text;
        }

        /* Large Touch Buttons Grid */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            background: #3e3e3e;
            color: white;
            border: none;
            padding: 16px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 0 #1a1a1a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a1a1a;
        }

        button.add-btn { background: #2e7d32; box-shadow: 0 4px 0 #1b5e20; }
        button.add-btn:active { box-shadow: 0 2px 0 #1b5e20; }

        button.sub-btn { background: #c62828; box-shadow: 0 4px 0 #8e1c1c; padding: 12px 10px; font-size: 14px;}
        button.sub-btn:active { box-shadow: 0 2px 0 #8e1c1c; }

        button.plus-ball { background: #5e35b1; box-shadow: 0 4px 0 #4527a0; }
        button.plus-strike { background: #1565c0; box-shadow: 0 4px 0 #0d47a1; }
        button.plus-out { background: #ef6c00; box-shadow: 0 4px 0 #b30000; }
        button.clear-btn { background: #4f5b66; box-shadow: 0 4px 0 #343d46; padding: 12px 10px; font-size: 14px;}
    </style>
</head>
<body>

    <!-- 1. THE SCOREBUG VISUAL BOX -->
    <div class="scorebug-display">
        <!-- Away Row -->
        <div class="team-grid">
            <div class="team-label-text away-color" id="bugAway">TEAM A</div>
            <div class="run-digit" id="dispAwayRuns">0</div>
        </div>
        <!-- Home Row -->
        <div class="team-grid">
            <div class="team-label-text home-color" id="bugHome">TEAM B</div>
            <div class="run-digit" id="dispHomeRuns">0</div>
        </div>
        
        <!-- Status Matrix Row -->
        <div class="data-row">
            <div class="data-box">
                <div class="data-label">Inning</div>
                <div class="data-value" id="dispInning">▲ 1</div>
            </div>
            <div class="data-box">
                <div class="data-label">Count (B-S)</div>
                <div class="data-value yellow-text" id="dispCount">0 - 0</div>
            </div>
            <div class="data-box">
                <div class="data-label">Outs</div>
                <div class="data-value yellow-text" id="dispOuts">0</div>
            </div>
        </div>
    </div>

    <!-- 2. THE CONTROL PANEL -->
    <div class="control-panel">
        
        <!-- Section: Team Names -->
        <div class="panel-section">
            <h3>Team Names</h3>
            <input type="text" id="inputAway" value="TEAM A" oninput="updateNames()" placeholder="Away Name...">
            <input type="text" id="inputHome" value="TEAM B" oninput="updateNames()" placeholder="Home Name...">
        </div>

        <!-- Section: Away Scoring -->
        <div class="panel-section">
            <h3 class="away-color">Away Team Runs</h3>
            <div class="btn-row">
                <button class="add-btn" onclick="adjustGame('awayRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustGame('awayRuns', -1)">-1 Run</button>
            </div>
        </div>

        <!-- Section: Home Scoring -->
        <div class="panel-section">
            <h3 class="home-color">Home Team Runs</h3>
            <div class="btn-row">
                <button class="add-btn" onclick="adjustGame('homeRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustGame('homeRuns', -1)">-1 Run</button>
            </div>
        </div>

        <!-- Section: Inning Controls -->
        <div class="panel-section">
            <h3>Inning Status</h3>
            <div class="btn-row">
                <button class="add-btn" style="background:#00796b; box-shadow:0 4px 0 #004d40;" onclick="adjustGame('inning', 1)">+1 Inning</button>
                <button class="sub-btn" onclick="adjustGame('inning', -1)">-1 Inning</button>
                <button class="clear-btn" onclick="toggleInningHalf()">Top / Bot</button>
            </div>
        </div>

        <!-- Section: At Bat Trackers -->
        <div class="panel-section">
            <h3>At Bat Trackers</h3>
            <div class="btn-row">
                <button class="plus-ball" onclick="adjustGame('balls', 1)">+1 Ball</button>
                <button class="plus-strike" onclick="adjustGame('strikes', 1)">+1 Strike</button>
            </div>
            <div class="btn-row">
                <button class="sub-btn" onclick="adjustGame('balls', -1)">-1 Ball</button>
                <button class="sub-btn" onclick="adjustGame('strikes', -1)">-1 Strike</button>
                <button class="clear-btn" onclick="clearCount()">Clear Count</button>
            </div>
        </div>

        <!-- Section: Inning Outs -->
        <div class="panel-section">
            <h3>Inning Outs</h3>
            <div class="btn-row">
                <button class="plus-out" onclick="adjustGame('outs', 1)">+1 Out</button>
                <button class="sub-btn" onclick="adjustGame('outs', -1)">-1 Out</button>
            </div>
        </div>

        <div class="btn-row" style="margin-top: 25px;">
            <button class="sub-btn" style="background:#b71c1c; box-shadow:0 4px 0 #5f0909; padding:15px;" onclick="resetWholeGame()">Reset Whole Board</button>
        </div>

    </div>

    <!-- 3. THE SCRIPT ENGINE -->
    <script>
        // Central State Memory Core
        let game = {
            awayRuns: 0,
            homeRuns: 0,
            inning: 1,
            isInningTop: true,
            balls: 0,
            strikes: 0,
            outs: 0
        };

        // Syncs typed letters in real-time
        function updateNames() {
            const awayVal = document.getElementById('inputAway').value;
            const homeVal = document.getElementById('inputHome').value;
            document.getElementById('bugAway').innerText = awayVal || 'AWAY';
            document.getElementById('bugHome').innerText = homeVal || 'HOME';
        }
